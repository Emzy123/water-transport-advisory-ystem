services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: wtap
      POSTGRES_PASSWORD: wtap_secret
      POSTGRES_DB: water_portal
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtap -d water_portal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://wtap:wtap_secret@db:5432/water_portal
      JWT_SECRET: enterprise_jwt_secret_minimum_32_chars_long
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
      PORT: 5000
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
