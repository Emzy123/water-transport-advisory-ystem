name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: wtap
          POSTGRES_PASSWORD: wtap_secret
          POSTGRES_DB: water_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install & migrate
        working-directory: server
        env:
          DATABASE_URL: postgresql://wtap:wtap_secret@localhost:5432/water_portal
          JWT_SECRET: ci_jwt_secret_minimum_32_characters_long
        run: |
          npm ci
          npx prisma migrate deploy
          npm run seed

      - name: Test API
        working-directory: server
        env:
          DATABASE_URL: postgresql://wtap:wtap_secret@localhost:5432/water_portal
          JWT_SECRET: ci_jwt_secret_minimum_32_characters_long
          CLIENT_URL: http://localhost:5173
        run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: http://localhost:5000/api/v1
        run: |
          npm ci
          npm run build
